name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  postflight-tests:
    name: Postflight smoke tests (Issues #18-#21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: |
          python -m pip install -U pip
          pip install pytest pytest-asyncio pytest-mock
      - name: Run postflight smoke tests (no third-party deps required)
        run: python scripts/tests/test_postflight_blog_check.py

      - name: Run preflight facts tests
        run: python scripts/tests/test_preflight_blog_facts.py

      # Guards the blog -> build_plan_state contract. Every High finding in the
      # 2026-08-31 review was a trigger leg the downstream silently dropped or
      # misassigned, and no other gate detects that class of defect.
      - name: Run build_plan_state trigger regression tests
        run: python scripts/tests/test_build_plan_state_triggers.py

      # Fail-closed coverage and AND-group gates. Both defects they cover
      # (a leg count mismatch, an AND group with a dropped partner) previously
      # passed every gate in the pipeline.
      - name: Run verify_plan coverage gate tests
        run: python scripts/tests/test_verify_plan_coverage.py

  ir-manifest-validator:
    name: IR manifest schema validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate generator template produces a valid manifest
        run: |
          python scripts/ir_facts_manifest.py --date 2026-05-11 --generate --force
          python scripts/ir_facts_manifest.py --date 2026-05-11 --validate

  trading-tests:
    name: Trading system tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + dev deps
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Run trading tests
        run: pytest trading/tests -q
